tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user for clarification or confirmation.

      Use this tool to:

      - obtain explicit yes/no confirmation before any action that modifies external systems
      - request information that cannot be inferred confidently

      If confirmation is required, use:

      response_type = yes_no

      Confirmation takes priority over collecting additional information.
    parameters:
      type: object
      properties:
        question: { type: string, default: "", description: "Câu hỏi" }
        response_type:
          {
            type: string,
            enum: [text, yes_no, choice],
            default: "text",
            description: "Kiểu trả lời",
          }
        options:
          {
            type: array,
            default: [],
            items: { type: string },
            description: "Các lựa chọn",
          }
      required: [question]

  - name: timeline
    description: >
      Retrieve recent posts from one specific social media account.

      Requires:
      - screenname

      If the referenced account cannot be identified confidently,
      use clarify.

      Do not ask for clarification when a unique public account
      can be resolved confidently.
    parameters:
      type: object
      properties:
        screenname: { type: string, default: "", description: "Tên tài khoản" }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [screenname]

  - name: social_search
    description: >
      Search public social media posts by keyword.

      Always use this tool whenever the user explicitly requests:

      - tweets
      - X posts
      - Twitter posts
      - social media posts

      If web search and social media are both requested,
      call both social_search and lookup.

      lookup does not retrieve social media posts.
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        search_type:
          {
            type: string,
            enum: [Latest, Top],
            default: "Latest",
            description: "Cách sắp xếp",
          }
        limit: { type: integer, default: 5, description: "Số lượng" }
      required: [query]

  - name: lookup
    description: >
      Search the public web.
      This tool retrieves web pages and news only.

      It does not search Twitter, X, or other social media.
      Use for:
      - news
      - web pages
      - recent events

      Do not use this tool if the user already provides a URL.

      Preserve the user's original query.

      Put news constraints into topic.

      Put time constraints into timeframe.

      Do not rewrite the query.
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        topic:
          {
            type: string,
            enum: [general, news],
            default: "general",
            description: "Phân loại",
          }
        timeframe:
          {
            type: string,
            enum: [day, week, month, year],
            default: "week",
            description: "Khoảng thời gian",
          }
        max_results: { type: integer, default: 5, description: "Số kết quả" }
      required: [query]

  - name: fetch
    description: >
      Read the contents of a specific webpage.

      Use only when the user already provides a complete URL.

      Never replace this tool with lookup.
    parameters:
      type: object
      properties:
        url: { type: string, default: "", description: "Địa chỉ" }
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              source: { type: string }
              summary: { type: string }
              section: { type: string }
        template:
          {
            type: string,
            enum: [brief, sections, bullets, thread, daily_ai_vn],
            default: "sections",
            description: "Khuôn",
          }
        headline: { type: string, default: "", description: "Tiêu đề" }
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Send or publish text.

      Never use this tool without explicit user confirmation.

      Before every send, publish, post, update or delete action,
      first call:

      clarify(response_type="yes_no")

      Do not request any additional information before confirmation.
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung" }
        confirmed: { type: boolean, default: false, description: "Cờ xác nhận" }
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Truy vấn" }
        policy_area:
          {
            type: string,
            enum:
              [
                all,
                ai_research,
                source_citation,
                data_privacy,
                external_publishing,
                tool_usage,
              ],
            default: "all",
            description: "Nhóm",
          }
        top_k: { type: integer, default: 3, description: "Số mục" }
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: { type: string, default: "", description: "Từ khóa" }
        max_results: { type: integer, default: 5, description: "Số lượng" }
        sort_by:
          {
            type: string,
            enum: [relevance, lastUpdatedDate, submittedDate],
            default: "relevance",
            description: "Sắp xếp",
          }
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: { type: string, default: "", description: "ID hoặc địa chỉ" }
        max_pages: { type: integer, default: 5, description: "Số trang" }
        max_chars: { type: integer, default: 8000, description: "Số ký tự" }
      required: [arxiv_url]

  - name: extract_keywords
    description: "Trích xuất các từ khóa (keywords) và thực thể chính từ một đoạn văn bản dài."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung văn bản cần trích xuất" }
        max_keywords: { type: integer, default: 5, description: "Số lượng từ khóa tối đa cần lấy" }
      required: [text]

  - name: translate_text
    description: "Dịch một đoạn văn bản ngoại ngữ sang ngôn ngữ đích (thường là tiếng Việt)."
    parameters:
      type: object
      properties:
        text: { type: string, default: "", description: "Nội dung văn bản cần dịch" }
        target_lang: { type: string, default: "vi", description: "Mã ngôn ngữ đích (ví dụ: vi, en)" }
      required: [text]

  - name: save_note
    description: "Lưu các ghi chú, tóm tắt hoặc nội dung quan trọng vào một file văn bản."
    parameters:
      type: object
      properties:
        note_content: { type: string, default: "", description: "Nội dung cần lưu" }
        filename: { type: string, default: "research_notes.md", description: "Tên file lưu trữ" }
      required: [note_content]


